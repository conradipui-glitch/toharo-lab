# nginx для toharo.space — раздача статики.
# Положить в /etc/nginx/sites-available/toharo-lab и слинковать в sites-enabled.
#
# TLS-строки ниже добавит certbot автоматически:
#   sudo certbot --nginx -d toharo.space -d www.toharo.space

server {
    listen 80;
    listen [::]:80;
    server_name toharo.space www.toharo.space;

    root /var/www/toharo-lab;
    index index.html;

    # trailingSlash: true в next.config — каждая страница это папка с index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Хешированные ассеты Next — можно кешировать навсегда
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML не кешируем, иначе новые посты не видны до истечения кеша
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Заголовки безопасности. CSP жёсткая: сайт статический, внешние запросы не нужны.
    # Шрифты Next инлайнит локально, поэтому CDN в списке не требуется.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Скрытые файлы наружу не отдаём
    location ~ /\. {
        deny all;
    }
}
